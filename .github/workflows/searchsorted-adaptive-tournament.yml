name: searchsorted adaptive policy tournament

on:
  push:
    branches:
      - research/searchsorted-selector-tournament
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-tournament:
    strategy:
      fail-fast: false
      matrix:
        suite: [adaptive_tiny, adaptive_mid, adaptive_large, adaptive_dtype]

    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SEARCHSORTED_TOURNAMENT_SUITE: ${{ matrix.suite }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: research/searchsorted-selector-tournament

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record runner metadata
        run: |
          mkdir -p adaptive-results
          {
            echo "suite=$SEARCHSORTED_TOURNAMENT_SUITE"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=$ImageOS"
            echo "image_version=$ImageVersion"
            echo "kernel=$(uname -a)"
            echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "cpu_count=$(nproc)"
            echo "memory_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')"
            echo "python=$(python --version 2>&1)"
          } | tee adaptive-results/runner-metadata.txt

      - name: Build one research wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p "$RUNNER_TEMP/wheels"
          python -m pip wheel . -w "$RUNNER_TEMP/wheels"

      - name: Create isolated environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheels/numpy-*.whl

      - name: Run adaptive policy matrix
        shell: bash
        run: |
          set -euo pipefail
          BENCH=benchmarks/benchmarks/searchsorted_selector_tournament.py
          SUITE="$SEARCHSORTED_TOURNAMENT_SUITE"

          NPY_SEARCHSORTED_RESEARCH_MODE=current           SEARCHSORTED_TOURNAMENT_OUT="adaptive-results/current-before-$SUITE.json"             "$RUNNER_TEMP/venv/bin/python" "$BENCH"

          # Reference paths for context.
          for MODE in galloping hybrid_sample16
          do
            NPY_SEARCHSORTED_RESEARCH_MODE="$MODE"             SEARCHSORTED_TOURNAMENT_OUT="adaptive-results/$MODE-$SUITE.json"               "$RUNNER_TEMP/venv/bin/python" "$BENCH"
          done

          NPY_SEARCHSORTED_RESEARCH_MODE=hybrid_chunk           NPY_SEARCHSORTED_RESEARCH_CHUNK=16           SEARCHSORTED_TOURNAMENT_OUT="adaptive-results/hybrid_chunk16-$SUITE.json"             "$RUNNER_TEMP/venv/bin/python" "$BENCH"

          # Eight staged policies, all from the same wheel.
          for POLICY in 0 1 2 3 4 5 6 7
          do
            LABEL="adaptive_p$POLICY"
            NPY_SEARCHSORTED_RESEARCH_MODE=adaptive             NPY_SEARCHSORTED_RESEARCH_POLICY="$POLICY"             SEARCHSORTED_TOURNAMENT_OUT="adaptive-results/$LABEL-$SUITE.json"               "$RUNNER_TEMP/venv/bin/python" "$BENCH"
          done

          NPY_SEARCHSORTED_RESEARCH_MODE=current           SEARCHSORTED_TOURNAMENT_OUT="adaptive-results/current-after-$SUITE.json"             "$RUNNER_TEMP/venv/bin/python" "$BENCH"

      - name: Summarize same-runner ratios
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python"             benchmarks/benchmarks/searchsorted_selector_analyze.py             adaptive-results "$SEARCHSORTED_TOURNAMENT_SUITE"             | tee "adaptive-results/console-summary-$SEARCHSORTED_TOURNAMENT_SUITE.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: searchsorted-adaptive-${{ matrix.suite }}
          path: adaptive-results/
