name: Searchsorted structural acceptance ledger
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run lightweight Q-free interval classification
        run: python research/searchsorted-qfree-interval-screen.py | tee interval-screen.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qfree-interval-results
          path: interval-screen.txt
          retention-days: 2
