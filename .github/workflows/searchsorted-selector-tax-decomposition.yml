name: searchsorted selector tax decomposition

on:
  push:
    branches:
      - research/searchsorted-selector-tournament
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-tax:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: micro-1vcpu-2gb
            cpus: 1
            mem_kb: 2097152
          - profile: small-2vcpu-4gb
            cpus: 2
            mem_kb: 4194304
          - profile: standard-4vcpu-8gb
            cpus: 4
            mem_kb: 8388608
          - profile: standard-4vcpu-14gb
            cpus: 4
            mem_kb: 14680064

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SEARCHSORTED_TOURNAMENT_SUITE: online_broad
      PROFILE_NAME: ${{ matrix.profile }}
      PROFILE_CPUS: ${{ matrix.cpus }}
      PROFILE_MEM_KB: ${{ matrix.mem_kb }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: research/searchsorted-selector-tournament

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record runner metadata
        run: |
          mkdir -p selector-tax-results
          {
            echo "profile=$PROFILE_NAME"
            echo "logical_cpus=$PROFILE_CPUS"
            echo "logical_mem_kb=$PROFILE_MEM_KB"
            echo "host_cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "host_nproc=$(nproc)"
            echo "host_mem_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')"
          } | tee selector-tax-results/runner-metadata.txt

      - name: Build one research wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p "$RUNNER_TEMP/wheels"
          python -m pip wheel . -w "$RUNNER_TEMP/wheels"

      - name: Create benchmark environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheels/numpy-*.whl

      - name: Run selector tax decomposition
        shell: bash
        run: |
          set -euo pipefail
          BENCH=benchmarks/benchmarks/searchsorted_selector_tournament.py
          SUITE="$SEARCHSORTED_TOURNAMENT_SUITE"
          CPULIST="0-$((PROFILE_CPUS-1))"

          run_case () {
            local label="$1"
            shift
            (
              ulimit -v "$PROFILE_MEM_KB"
              taskset -c "$CPULIST" env "$@" \
                SEARCHSORTED_TOURNAMENT_OUT="selector-tax-results/$label-$SUITE.json" \
                "$RUNNER_TEMP/venv/bin/python" "$BENCH"
            )
          }

          run_current () {
            local label="$1"
            run_case "$label" \
              NPY_SEARCHSORTED_RESEARCH_MODE=current \
              NPY_SEARCHSORTED_RESEARCH_LABEL="$label"
          }

          run_current current-before

          for probe in 32 64 128; do
            run_case "split_p$probe" \
              NPY_SEARCHSORTED_RESEARCH_MODE=split_current_control \
              NPY_SEARCHSORTED_RESEARCH_LABEL="split_p$probe" \
              NPY_SS_EARLY_PROBE="$probe"
          done

          for obs in 4 8 12 16; do
            run_case "sig_o$obs" \
              NPY_SEARCHSORTED_RESEARCH_MODE=signature_then_current \
              NPY_SEARCHSORTED_RESEARCH_LABEL="sig_o$obs" \
              NPY_SS_EARLY_OBS="$obs"
          done

          run_current current-mid

          for probe in 32 64 128; do
            for obs in 4 8; do
              run_case "observe_p${probe}_o${obs}" \
                NPY_SEARCHSORTED_RESEARCH_MODE=early_observe_current \
                NPY_SEARCHSORTED_RESEARCH_LABEL="observe_p${probe}_o${obs}" \
                NPY_SS_EARLY_PROBE="$probe" \
                NPY_SS_EARLY_OBS="$obs"
            done
          done

          run_current current-after

      - name: Summarize normalized ratios
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" \
            benchmarks/benchmarks/searchsorted_selector_analyze.py \
            selector-tax-results "$SEARCHSORTED_TOURNAMENT_SUITE" \
            | tee selector-tax-results/console-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: searchsorted-selector-tax-${{ matrix.profile }}
          path: selector-tax-results/
