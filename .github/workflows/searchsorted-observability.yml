name: Searchsorted direct C++ structural trace verification
on:
  push:
    branches: [research/searchsorted-structural-observability]
    paths:
      - 'research/searchsorted-structural-gate/benchmark.py'
      - 'research/searchsorted-structural-gate/compare.py'
      - '.github/workflows/searchsorted-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'meson-python>=0.20' 'Cython>=3.1' ninja pytest hypothesis
      - name: Prepare exact upstream baseline
        run: |
          git fetch --no-tags https://github.com/numpy/numpy.git 82b2cf5518c8ccf163c3112efddd803764266fa2
          git worktree add --detach /tmp/numpy-base 82b2cf5518c8ccf163c3112efddd803764266fa2
          git -C /tmp/numpy-base submodule update --init --recursive
      - name: Build separate wheels
        run: |
          mkdir -p /tmp/wheel-base /tmp/wheel-a0
          python -m pip wheel /tmp/numpy-base --no-build-isolation --no-deps -w /tmp/wheel-base -Csetup-args=-Dallow-noblas=true
          python -m pip wheel . --no-build-isolation --no-deps -w /tmp/wheel-a0 -Csetup-args=-Dallow-noblas=true
      - name: Install isolated wheels
        run: |
          python -m pip install --no-deps --target /tmp/np-base /tmp/wheel-base/*.whl
          python -m pip install --no-deps --target /tmp/np-a0 /tmp/wheel-a0/*.whl
      - name: Validate upstream searchsorted correctness
        run: |
          cd /tmp
          PYTHONPATH=/tmp/np-a0 python -m pytest --pyargs numpy._core.tests.test_multiarray -k searchsorted -q
      - name: Trace C++ paths against independent shadow ledger
        run: |
          cd /tmp
          NPY_SEARCHSORTED_TRACE=1 PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/trace_compare.py" > cases.json 2> paths.log
          python - <<'PY'
          import json
          cases=json.load(open("cases.json"))
          actual=[s.split("SEARCHSORTED_PATH ",1)[1].strip() for s in open("paths.log") if "SEARCHSORTED_PATH " in s]
          assert len(actual)==len(cases),(len(actual),len(cases))
          bad=[(case,got) for case,got in zip(cases,actual) if case["shadow"]!=got]
          print("C++ trace cases",len(cases),"mismatches",len(bad))
          print("path distributions",{p:actual.count(p) for p in set(actual)})
          assert not bad,bad[:10]
          PY
      - name: Benchmark identical cases in ABBA order
        if: false
        run: |
          cd /tmp
          PYTHONPATH=/tmp/np-base python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/benchmark.py" > base1.json
          PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/benchmark.py" > a0_1.json
          PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/benchmark.py" > a0_2.json
          PYTHONPATH=/tmp/np-base python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/benchmark.py" > base2.json
          python "$GITHUB_WORKSPACE/research/searchsorted-structural-gate/compare.py" base1.json a0_1.json a0_2.json base2.json | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-direct-trace
          path: |
            /tmp/base1.json
            /tmp/a0_1.json
            /tmp/a0_2.json
            /tmp/base2.json
            /tmp/summary.txt
            /tmp/cases.json
            /tmp/paths.log
          retention-days: 2
