name: Searchsorted A0 hoisted-tail ABBA validation
on:
  push:
    branches: [research/searchsorted-tail-a0-hoisted]
    paths:
      - 'research/searchsorted-tail-a0-clean/targeted_benchmark.py'
      - 'research/searchsorted-tail-a0-clean/compare.py'
      - '.github/workflows/searchsorted-a0-hoisted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'meson-python>=0.20' 'Cython>=3.1' ninja pytest hypothesis
      - name: Prepare exact upstream baseline
        run: |
          git fetch --no-tags https://github.com/numpy/numpy.git 82b2cf5518c8ccf163c3112efddd803764266fa2
          git worktree add --detach /tmp/numpy-base 82b2cf5518c8ccf163c3112efddd803764266fa2
          git -C /tmp/numpy-base submodule update --init --recursive
      - name: Build separate wheels
        run: |
          mkdir -p /tmp/wheel-base /tmp/wheel-a0
          python -m pip wheel /tmp/numpy-base --no-build-isolation --no-deps -w /tmp/wheel-base -Csetup-args=-Dallow-noblas=true
          python -m pip wheel . --no-build-isolation --no-deps -w /tmp/wheel-a0 -Csetup-args=-Dallow-noblas=true
      - name: Install isolated wheels
        run: |
          python -m pip install --no-deps --target /tmp/np-base /tmp/wheel-base/*.whl
          python -m pip install --no-deps --target /tmp/np-a0 /tmp/wheel-a0/*.whl
      - name: Validate hoisted tail correctness
        run: |
          cd /tmp
          PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/test_correctness.py"
          PYTHONPATH=/tmp/np-a0 python -m pytest "$GITHUB_WORKSPACE/numpy/_core/tests/test_multiarray.py" -k searchsorted -q
      - name: Benchmark identical cases in ABBA order
        run: |
          cd /tmp
          PYTHONPATH=/tmp/np-base python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/targeted_benchmark.py" > base1.json
          PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/targeted_benchmark.py" > a0_1.json
          PYTHONPATH=/tmp/np-a0 python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/targeted_benchmark.py" > a0_2.json
          PYTHONPATH=/tmp/np-base python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/targeted_benchmark.py" > base2.json
          python "$GITHUB_WORKSPACE/research/searchsorted-tail-a0-clean/compare.py" base1.json a0_1.json a0_2.json base2.json | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-hoisted-tail
          path: |
            /tmp/base1.json
            /tmp/a0_1.json
            /tmp/a0_2.json
            /tmp/base2.json
            /tmp/summary.txt
            /tmp/comparison.json
          retention-days: 2
