name: Q-free interval information screen
on:
  push:
    branches: [research/searchsorted-qfree-interval-screen]
    paths:
      - 'research/searchsorted-qfree-interval-screen.py'
      - '.github/workflows/searchsorted-qfree-interval-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  information-screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic interval classifier screen
        run: |
          python research/searchsorted-qfree-interval-screen.py | tee /tmp/interval-screen.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qfree-interval-screen
          path: /tmp/interval-screen.txt
          retention-days: 2
