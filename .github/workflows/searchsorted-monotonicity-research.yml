name: searchsorted monotonicity research

on:
  push:
    branches:
      - research/searchsorted-monotonicity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: research/searchsorted-monotonicity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyperf

      - name: Create worktrees
        run: |
          git fetch origin \
            research/searchsorted-monotonicity \
            research/searchsorted-prev-bound \
            research/searchsorted-galloping
          git worktree add ../numpy-current origin/research/searchsorted-monotonicity
          git worktree add ../numpy-prev origin/research/searchsorted-prev-bound
          git worktree add ../numpy-gallop origin/research/searchsorted-galloping
          git -C ../numpy-current submodule update --init --recursive
          git -C ../numpy-prev submodule update --init --recursive
          git -C ../numpy-gallop submodule update --init --recursive

      - name: Build isolated wheels
        run: |
          mkdir -p "$RUNNER_TEMP/wheels/current" "$RUNNER_TEMP/wheels/prev" "$RUNNER_TEMP/wheels/gallop"
          python -m pip wheel ../numpy-current -w "$RUNNER_TEMP/wheels/current"
          python -m pip wheel ../numpy-prev -w "$RUNNER_TEMP/wheels/prev"
          python -m pip wheel ../numpy-gallop -w "$RUNNER_TEMP/wheels/gallop"

      - name: Create isolated benchmark environments
        run: |
          python -m venv "$RUNNER_TEMP/venv-current"
          python -m venv "$RUNNER_TEMP/venv-prev"
          python -m venv "$RUNNER_TEMP/venv-gallop"

          "$RUNNER_TEMP/venv-current/bin/pip" install pyperf "$RUNNER_TEMP"/wheels/current/numpy-*.whl
          "$RUNNER_TEMP/venv-prev/bin/pip" install pyperf "$RUNNER_TEMP"/wheels/prev/numpy-*.whl
          "$RUNNER_TEMP/venv-gallop/bin/pip" install pyperf "$RUNNER_TEMP"/wheels/gallop/numpy-*.whl

      - name: Run paired screening benchmarks
        run: |
          mkdir -p research-results
          "$RUNNER_TEMP/venv-current/bin/python" benchmarks/benchmarks/searchsorted_monotonicity_research.py \
            --variant current --fast -o research-results/current.json
          "$RUNNER_TEMP/venv-prev/bin/python" benchmarks/benchmarks/searchsorted_monotonicity_research.py \
            --variant prev_bound --fast -o research-results/prev_bound.json
          "$RUNNER_TEMP/venv-gallop/bin/python" benchmarks/benchmarks/searchsorted_monotonicity_research.py \
            --variant galloping --fast -o research-results/galloping.json

      - name: Compare variants
        run: |
          python -m pyperf compare_to research-results/current.json research-results/prev_bound.json \
            --table --python-names=current,prev_bound | tee research-results/current-vs-prev.txt
          python -m pyperf compare_to research-results/current.json research-results/galloping.json \
            --table --python-names=current,galloping | tee research-results/current-vs-galloping.txt

      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: searchsorted-monotonicity-results
          path: research-results/
