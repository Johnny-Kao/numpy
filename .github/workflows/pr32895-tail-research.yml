name: PR32895 research tail V1
on:
  push:
    branches:
      - research/pr32895-maintainer-last-passes
    paths:
      - '.github/workflows/pr32895-tail-research.yml'
      - 'research/pr32895-maintainer-last-passes/test_tail_v1.py'
      - 'research/pr32895-maintainer-last-passes/tail_microbench.cpp'
      - 'numpy/_core/src/npysort/binsearch.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build NumPy from this exact research commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'meson-python>=0.20' 'Cython>=3.1' ninja
          python -m pip install -e . --no-build-isolation -Csetup-args=-Dallow-noblas=true
      - name: Run focused correctness matrix
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/research/pr32895-maintainer-last-passes/test_tail_v1.py"

      - name: Run controlled C++ tail microbenchmark
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -o /tmp/tailbench research/pr32895-maintainer-last-passes/tail_microbench.cpp
          /tmp/tailbench
