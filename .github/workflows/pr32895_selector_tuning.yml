name: PR 32895 cheap selector tournament

on:
  push:
    branches:
      - research/pr32895-review-validation
    paths:
      - tools/pr32895_validation/apply_selector_variant.py
      - .github/workflows/pr32895_selector_tuning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MESON_ARGS: -Dallow-noblas=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements/build_requirements.txt

      - name: Preserve harnesses
        run: |
          cp tools/pr32895_validation/searchsorted_locality_validation.py /tmp/pr32895_validation.py
          cp tools/pr32895_validation/apply_selector_variant.py /tmp/apply_selector_variant.py

      - name: Baseline before
        run: |
          spin build
          spin python /tmp/pr32895_validation.py -- run \
            --label baseline_before \
            --output /tmp/baseline_before.json \
            --repeat 15

      - name: Run all cheap selector variants
        shell: bash
        run: |
          set -euo pipefail
          for variant in full_adjacent right_only left_only half_adjacent alternating; do
            git checkout -- numpy/_core/src/npysort/binsearch.cpp
            python /tmp/apply_selector_variant.py "$variant"
            git diff --check
            spin build
            spin python /tmp/pr32895_validation.py -- run \
              --label "$variant" \
              --output "/tmp/${variant}.json" \
              --repeat 15
          done

      - name: Baseline after
        run: |
          git checkout -- numpy/_core/src/npysort/binsearch.cpp
          spin build
          spin python /tmp/pr32895_validation.py -- run \
            --label baseline_after \
            --output /tmp/baseline_after.json \
            --repeat 15

      - name: Compare tournament
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path

          variants = ['full_adjacent','right_only','left_only','half_adjacent','alternating']
          cases = [
              'ordered_control',
              'adversarial_random_interiors',
              'adversarial_oscillating_interiors',
              'adversarial_reversed_blocks',
          ]
          sides = ['left','right']

          def load(name):
              return json.load(open(f'/tmp/{name}.json'))

          before = load('baseline_before')
          after = load('baseline_after')
          vv = {v: load(v) for v in variants}

          def med(d, case, side):
              return d['benchmarks'][case][side]['median_s']

          lines = [
              '# PR #32895 cheap selector tournament',
              '',
              '## Baseline drift',
              '',
              '| Case | Side | Before | After | Drift |',
              '|---|---|---:|---:|---:|',
          ]
          stable = True
          refs = {}
          for case in cases:
              for side in sides:
                  b = med(before, case, side)
                  a = med(after, case, side)
                  drift = (a / b - 1.0) * 100.0
                  refs[(case, side)] = statistics.median([b, a])
                  if abs(drift) > 3.0:
                      stable = False
                  lines.append(f'| {case} | {side} | {b:.6f} | {a:.6f} | {drift:+.2f}% |')

          lines += ['', f'Baseline drift gate: {"PASS" if stable else "INCONCLUSIVE"}', '',
                    '## Variant deltas vs A/A baseline reference', '',
                    '| Variant | Ordered L | Ordered R | Random L | Random R | Osc L | Osc R | Reversed L | Reversed R | Worst ordered |',
                    '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|']

          summary = []
          for v in variants:
              ds = {}
              for case in cases:
                  for side in sides:
                      x = med(vv[v], case, side)
                      ds[(case, side)] = (x / refs[(case, side)] - 1.0) * 100.0
              worst_ordered = max(ds[('ordered_control','left')], ds[('ordered_control','right')])
              mean_bad = statistics.mean(ds[(case, side)] for case in cases[1:] for side in sides)
              summary.append((worst_ordered, mean_bad, v, ds))
              lines.append(
                  f'| {v} | {ds[("ordered_control","left")]:+.2f}% | {ds[("ordered_control","right")]:+.2f}% | '
                  f'{ds[("adversarial_random_interiors","left")]:+.2f}% | {ds[("adversarial_random_interiors","right")]:+.2f}% | '
                  f'{ds[("adversarial_oscillating_interiors","left")]:+.2f}% | {ds[("adversarial_oscillating_interiors","right")]:+.2f}% | '
                  f'{ds[("adversarial_reversed_blocks","left")]:+.2f}% | {ds[("adversarial_reversed_blocks","right")]:+.2f}% | '
                  f'{worst_ordered:+.2f}% |')

          summary.sort(key=lambda x: (x[0] > 3.0, x[0], x[1]))
          lines += ['', '## Ranking', '']
          for rank, (worst_ordered, mean_bad, v, ds) in enumerate(summary, 1):
              lines.append(f'{rank}. `{v}` — worst ordered {worst_ordered:+.2f}%, mean deception {mean_bad:+.2f}%')

          Path('/tmp/tournament.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheap-selector-tournament
          path: |
            /tmp/baseline_before.json
            /tmp/full_adjacent.json
            /tmp/right_only.json
            /tmp/left_only.json
            /tmp/half_adjacent.json
            /tmp/alternating.json
            /tmp/baseline_after.json
            /tmp/tournament.md
          if-no-files-found: warn
          retention-days: 7
