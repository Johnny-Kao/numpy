name: Searchsorted crossover benchmark

on:
  push:
    branches:
      - research/searchsorted-crossover-ci
    paths:
      - "benchmarks/searchsorted_crossover/**"
      - ".github/workflows/searchsorted-crossover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ubuntu-24.04 repeat ${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]

    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned benchmark dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.5.1"

      - name: Record runner environment
        run: |
          mkdir -p benchmark-output
          {
            echo "matrix_repeat=${{ matrix.repeat }}"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo
            uname -a
            echo
            lscpu
            echo
            cat /proc/cpuinfo
            echo
            free -b
            echo
            python --version
            python -c "import numpy; print('numpy', numpy.__version__)"
            gcc --version
            echo
            echo "cpufreq governor:"
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            echo "cpufreq driver:"
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_driver 2>/dev/null || true
            echo "microcode:"
            cat /sys/devices/system/cpu/cpu0/microcode/version 2>/dev/null || true
          } | tee benchmark-output/runner.txt

      - name: Run pinned single-CPU benchmark
        run: |
          taskset -c 0 python benchmarks/searchsorted_crossover/run_benchmark.py \
            --output-dir benchmark-output \
            --reps 31 \
            --warmups 8 | tee benchmark-output/stdout.txt

      - name: Upload raw benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: searchsorted-crossover-ubuntu2404-repeat-${{ matrix.repeat }}
          path: benchmark-output/
          if-no-files-found: error
          retention-days: 30
