name: searchsorted fine adaptive matrix

on:
  push:
    branches:
      - research/searchsorted-selector-tournament
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fine-sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: micro-1vcpu-2gb
            cpus: 1
            mem_kb: 2097152
          - profile: small-2vcpu-4gb
            cpus: 2
            mem_kb: 4194304
          - profile: standard-4vcpu-8gb
            cpus: 4
            mem_kb: 8388608
          - profile: standard-4vcpu-14gb
            cpus: 4
            mem_kb: 14680064

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SEARCHSORTED_TOURNAMENT_SUITE: adaptive_fine
      PROFILE_NAME: ${{ matrix.profile }}
      PROFILE_CPUS: ${{ matrix.cpus }}
      PROFILE_MEM_KB: ${{ matrix.mem_kb }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: research/searchsorted-selector-tournament

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record runner metadata
        run: |
          mkdir -p fine-results
          {
            echo "profile=$PROFILE_NAME"
            echo "logical_cpus=$PROFILE_CPUS"
            echo "logical_mem_kb=$PROFILE_MEM_KB"
            echo "host_cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "host_nproc=$(nproc)"
            echo "host_mem_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')"
            echo "python=$(python --version 2>&1)"
          } | tee fine-results/runner-metadata.txt

      - name: Build one research wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p "$RUNNER_TEMP/wheels"
          python -m pip wheel . -w "$RUNNER_TEMP/wheels"

      - name: Create benchmark environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheels/numpy-*.whl

      - name: Run 48-policy fine sweep
        shell: bash
        run: |
          set -euo pipefail
          BENCH=benchmarks/benchmarks/searchsorted_selector_tournament.py
          SUITE="$SEARCHSORTED_TOURNAMENT_SUITE"
          CPULIST="0-$((PROFILE_CPUS-1))"

          run_case () {
            local label="$1"
            shift
            (
              ulimit -v "$PROFILE_MEM_KB"
              taskset -c "$CPULIST" env "$@" \
                SEARCHSORTED_TOURNAMENT_OUT="fine-results/$label-$SUITE.json" \
                "$RUNNER_TEMP/venv/bin/python" "$BENCH"
            )
          }

          run_current () {
            local label="$1"
            run_case "$label" \
              NPY_SEARCHSORTED_RESEARCH_MODE=current \
              NPY_SEARCHSORTED_RESEARCH_LABEL="$label"
          }

          run_current current-before

          thresholds=(
            "32 512 8192"
            "64 1024 8192"
            "128 2048 32768"
            "256 4096 65536"
          )
          samples=(
            "4 8 16"
            "8 16 32"
            "8 16 64"
            "8 24 64"
          )
          inversions=(
            "0 0 0"
            "0 1 2"
            "0 1 3"
          )

          idx=0
          for T in "${thresholds[@]}"; do
            read -r A S2 S3 <<< "$T"
            for S in "${samples[@]}"; do
              read -r N1 N2 N3 <<< "$S"
              for I in "${inversions[@]}"; do
                read -r I1 I2 I3 <<< "$I"
                label=$(printf "c%02d_a%s_t%s_%s_s%s_%s_%s_i%s_%s_%s" \
                  "$idx" "$A" "$S2" "$S3" "$N1" "$N2" "$N3" "$I1" "$I2" "$I3")

                run_case "$label" \
                  NPY_SEARCHSORTED_RESEARCH_MODE=adaptive_dynamic \
                  NPY_SEARCHSORTED_RESEARCH_LABEL="$label" \
                  NPY_SS_ACTIVATE_Q="$A" \
                  NPY_SS_STAGE2_Q="$S2" \
                  NPY_SS_STAGE3_Q="$S3" \
                  NPY_SS_SAMPLES1="$N1" \
                  NPY_SS_SAMPLES2="$N2" \
                  NPY_SS_SAMPLES3="$N3" \
                  NPY_SS_INV1="$I1" \
                  NPY_SS_INV2="$I2" \
                  NPY_SS_INV3="$I3"

                idx=$((idx+1))
                if [[ "$idx" -eq 24 ]]; then
                  run_current current-mid
                fi
              done
            done
          done

          run_current current-after

      - name: Summarize normalized ratios
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" \
            benchmarks/benchmarks/searchsorted_selector_analyze.py \
            fine-results "$SEARCHSORTED_TOURNAMENT_SUITE" \
            | tee "fine-results/console-summary.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: searchsorted-fine-${{ matrix.profile }}
          path: fine-results/
