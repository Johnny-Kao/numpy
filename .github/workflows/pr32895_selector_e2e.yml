name: PR 32895 selector end-to-end

on:
  push:
    branches:
      - research/pr32895-review-validation
    paths:
      - tools/pr32895_validation/apply_adjacent_selector.py
      - .github/workflows/pr32895_selector_e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - current
          - adjacent
    env:
      MESON_ARGS: -Dallow-noblas=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements/build_requirements.txt

      - name: Apply research selector variant
        if: matrix.variant == 'adjacent'
        run: |
          python tools/pr32895_validation/apply_adjacent_selector.py
          git diff --check
          git diff -- numpy/_core/src/npysort/binsearch.cpp

      - name: Build NumPy
        run: |
          spin build

      - name: Run stable end-to-end harness
        run: |
          spin python tools/pr32895_validation/searchsorted_locality_validation.py -- run \
            --label "${{ matrix.variant }}" \
            --output "pr32895_${{ matrix.variant }}.json" \
            --repeat 15

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: selector-e2e-${{ matrix.variant }}
          path: pr32895_${{ matrix.variant }}.json
          retention-days: 7
